# Apache James 3.9.0 disposable compatibility-lab configuration.
# The URL prefix comes from the runner so Session URLs remain reachable from
# outside the container. No mail is delivered by this lab.
enabled=true
jmap.port=80

tls.keystoreURL=file://conf/keystore
tls.secret=james72laBalle

url.prefix=${env:JMAP_URL_PREFIX:-http://127.0.0.1:18080}
authentication.strategy.rfc8621=BasicAuthenticationStrategy
jmap.version.default=rfc-8621
delay.sends.enabled=false
