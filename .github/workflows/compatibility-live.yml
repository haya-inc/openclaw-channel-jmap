name: JMAP compatibility (live)

on:
  workflow_dispatch:
    inputs:
      server:
        description: JMAP server profile
        required: true
        type: choice
        options:
          - stalwart
          - fastmail
          - cyrus
          - apache-james
          - generic
      scope:
        description: Required compatibility scope
        required: true
        default: read
        type: choice
        options:
          - read
          - manage
          - send
          - full
      server_version:
        description: Deployed server version or service release
        required: true
        type: string
      target_artifact:
        description: Public server artifact identifier (never a hostname or credential)
        required: true
        default: live-service
        type: string
      run_draft_contract:
        description: Create and destroy recipient-free drafts in a dedicated test account
        required: true
        default: false
        type: boolean
      run_outbound_contract:
        description: Submit mail only to the selected identity itself
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: compatibility-${{ inputs.server }}
    env:
      JMAP_SESSION_URL: ${{ secrets.JMAP_SESSION_URL }}
      JMAP_AUTH_MODE: ${{ vars.JMAP_AUTH_MODE }}
      JMAP_USERNAME: ${{ secrets.JMAP_USERNAME }}
      JMAP_PASSWORD: ${{ secrets.JMAP_PASSWORD }}
      JMAP_API_TOKEN: ${{ secrets.JMAP_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply Fastmail public endpoint defaults
        if: inputs.server == 'fastmail'
        shell: bash
        run: |
          if [[ -z "${JMAP_SESSION_URL}" ]]; then
            echo "JMAP_SESSION_URL=https://api.fastmail.com/jmap/session" >> "$GITHUB_ENV"
          fi
          if [[ -z "${JMAP_AUTH_MODE}" ]]; then
            echo "JMAP_AUTH_MODE=bearer" >> "$GITHUB_ENV"
          fi
      - id: probe
        name: Run content-free compatibility probe
        shell: bash
        run: |
          set +e
          node dist/src/compatibility-bin.js \
            --server "${{ inputs.server }}" \
            --scope "${{ inputs.scope }}" \
            --json > compatibility-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package redacted evidence
        if: always() && hashFiles('compatibility-report.json') != ''
        run: |
          node scripts/compatibility/create-evidence.mjs \
            --report compatibility-report.json \
            --output compatibility-evidence.json \
            --level live \
            --server-version "${{ inputs.server_version }}" \
            --artifact "${{ inputs.target_artifact }}" \
            --source-revision "${GITHUB_SHA}"
      - id: draft_contract
        name: Run recipient-free draft contract
        if: inputs.run_draft_contract
        env:
          JMAP_STATEFUL_TEST_ALLOW_MUTATION: draft-only
          JMAP_TEST_ACCOUNT_CLASS: dedicated-test
        shell: bash
        run: |
          set +e
          node dist/src/stateful-contract-bin.js \
            --server "${{ inputs.server }}" \
            --json > stateful-contract-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - id: outbound_contract
        name: Run self-addressed outbound contract
        if: inputs.run_outbound_contract
        env:
          JMAP_OUTBOUND_TEST_ALLOW_DELIVERY: self-only
          JMAP_TEST_ACCOUNT_CLASS: dedicated-test
        shell: bash
        run: |
          set +e
          node dist/src/outbound-contract-bin.js \
            --server "${{ inputs.server }}" \
            --json > outbound-contract-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package draft contract evidence
        if: always() && inputs.run_draft_contract && hashFiles('stateful-contract-report.json') != ''
        run: |
          node scripts/compatibility/create-contract-evidence.mjs \
            --report stateful-contract-report.json \
            --output stateful-contract-evidence.json \
            --level live \
            --server-version "${{ inputs.server_version }}" \
            --artifact "${{ inputs.target_artifact }}" \
            --source-revision "${GITHUB_SHA}"
      - name: Package outbound contract evidence
        if: always() && inputs.run_outbound_contract && hashFiles('outbound-contract-report.json') != ''
        run: |
          node scripts/compatibility/create-contract-evidence.mjs \
            --report outbound-contract-report.json \
            --output outbound-contract-evidence.json \
            --level live \
            --server-version "${{ inputs.server_version }}" \
            --artifact "${{ inputs.target_artifact }}" \
            --source-revision "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmap-compatibility-${{ inputs.server }}-${{ inputs.scope }}
          path: |
            compatibility-report.json
            compatibility-evidence.json
            stateful-contract-report.json
            stateful-contract-evidence.json
            outbound-contract-report.json
            outbound-contract-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce compatibility verdict
        env:
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: test "$PROBE_EXIT_CODE" -eq 0
      - name: Enforce draft contract verdict
        if: inputs.run_draft_contract
        env:
          DRAFT_CONTRACT_EXIT_CODE: ${{ steps.draft_contract.outputs.exit_code }}
        run: test "$DRAFT_CONTRACT_EXIT_CODE" -eq 0
      - name: Enforce outbound contract verdict
        if: inputs.run_outbound_contract
        env:
          OUTBOUND_CONTRACT_EXIT_CODE: ${{ steps.outbound_contract.outputs.exit_code }}
        run: test "$OUTBOUND_CONTRACT_EXIT_CODE" -eq 0
